pid /tmp/nginx.pid;
worker_processes 1;
error_log /tmp/nginx-error.log warn;

events { worker_connections 128; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 1m;
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    proxy_cache_path /tmp/cache levels=1:2 keys_zone=workbench:1m max_size=8m inactive=10m use_temp_path=off;

    server {
        listen 127.0.0.1:9080;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        location = /session {
            proxy_pass http://127.0.0.1:4000/session;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /license {
            proxy_pass http://127.0.0.1:4000/license;
            proxy_set_header Host $host;
        }

        location = /eula/status {
            proxy_pass http://127.0.0.1:4000/eula/status;
            proxy_set_header Host $host;
        }

        location = /eula/accept {
            proxy_pass http://127.0.0.1:4000/eula/accept;
            proxy_set_header Host $host;
        }

        location = /health/ready {
            proxy_pass http://127.0.0.1:4000/health/ready;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /graphql {
            proxy_pass http://127.0.0.1:4000/graphql;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
